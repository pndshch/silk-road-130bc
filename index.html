<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>シルクロードの隊商 紀元前130年 — Silk Road Caravan 130 BC</title>
<meta name="description" content="張騫が切り拓いたシルクロードを隊商で旅し、絹・翡翠・香辛料を交易する歴史シミュレーションゲーム。長安からローマへ、8都市を結ぶ古代最大の交易路を体験せよ。">
<meta property="og:title" content="シルクロードの隊商 紀元前130年 — Silk Road Caravan">
<meta property="og:description" content="張騫が切り拓いたシルクロードを隊商で旅し、交易する歴史ゲーム。長安→ローマ、8都市。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation}
body{background:#1a0e05;color:#f0e6d3;font-family:'Helvetica Neue',Arial,sans-serif}

/* ── Language toggle ── */
.lang-sw{position:fixed;top:6px;right:6px;display:flex;gap:2px;background:rgba(0,0,0,.7);border-radius:6px;padding:2px;z-index:200}
.lang-sw button{background:transparent;border:none;color:#a09080;font-size:11px;font-weight:700;padding:4px 8px;border-radius:4px;cursor:pointer}
.lang-sw button.active{background:#c4956a;color:#1a0e05}

/* ── Title screen ── */
#titleScreen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
background:linear-gradient(180deg,#0d0805 0%,#2a1a0a 40%,#4a2a10 70%,#1a0e05 100%);z-index:100;text-align:center;padding:20px}
#titleScreen h1{font-size:clamp(28px,6vw,48px);font-weight:900;color:#c4956a;text-shadow:0 2px 20px rgba(196,149,106,.4);margin-bottom:8px;line-height:1.2}
#titleScreen .subtitle{font-size:clamp(13px,3vw,18px);color:#8a7a6a;margin-bottom:6px}
#titleScreen .year-label{font-size:clamp(20px,4vw,32px);font-weight:800;color:#d4a574;margin-bottom:24px}
#titleScreen .intro{max-width:500px;font-size:clamp(12px,2.5vw,15px);color:#a09080;line-height:1.7;margin-bottom:32px}
#titleScreen .start-btn{background:linear-gradient(135deg,#c4956a,#8a6040);border:none;color:#fff;font-size:18px;font-weight:700;
padding:14px 48px;border-radius:12px;cursor:pointer;box-shadow:0 4px 20px rgba(196,149,106,.3);transition:transform .15s,box-shadow .15s}
#titleScreen .start-btn:hover{transform:translateY(-2px);box-shadow:0 6px 30px rgba(196,149,106,.5)}
.camel-art{font-size:clamp(40px,10vw,80px);margin-bottom:16px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}

/* ── Game screen ── */
#gameScreen{position:absolute;inset:0;display:none;flex-direction:column}

/* Top bar */
.top-bar{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:#120a04;border-bottom:1px solid #3a2a1a;flex-shrink:0;min-height:40px;gap:4px;flex-wrap:nowrap;overflow-x:auto}
@media(max-width:480px){.top-bar{padding:4px 8px;gap:3px}.res{font-size:11px !important}}
.res{display:flex;align-items:center;gap:4px;font-size:clamp(11px,2.5vw,14px);font-weight:600;white-space:nowrap}
.res .icon{font-size:clamp(14px,3vw,18px)}
.res .val{color:#d4a574}

/* Map area */
.map-area{flex:1;position:relative;overflow:hidden;background:linear-gradient(180deg,#1a1408 0%,#2a1a0a 30%,#3a2510 60%,#2a1a0a 100%)}
.map-canvas{width:100%;height:100%}

/* City panel (bottom sheet) */
.city-panel{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(180deg,#1a0e05ee,#120a04);
border-top:2px solid #c4956a;padding:12px;max-height:70vh;overflow-y:auto;display:none;z-index:50}
.city-panel.show{display:block}
.city-name{font-size:clamp(18px,4vw,24px);font-weight:800;color:#c4956a;margin-bottom:2px}
.city-desc{font-size:clamp(11px,2.5vw,13px);color:#a09080;line-height:1.5;margin-bottom:10px}
.history-box{background:#2a1a0a;border:1px solid #3a2a1a;border-radius:8px;padding:10px;margin-bottom:10px;font-size:clamp(11px,2.5vw,13px);color:#c4956a;line-height:1.6}
.history-box .hist-title{font-weight:700;margin-bottom:4px;font-size:clamp(12px,2.5vw,14px)}

/* Trade grid */
.trade-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:12px}
.trade-item{background:#2a1a0a;border:1px solid #3a2a1a;border-radius:8px;padding:8px;text-align:center}
.trade-item .t-name{font-size:clamp(12px,2.5vw,14px);font-weight:700;color:#d4a574;margin-bottom:4px}
.trade-item .t-price{font-size:clamp(11px,2.5vw,13px);color:#8a7a6a;margin-bottom:6px}
.trade-item .t-own{font-size:11px;color:#6a5a4a;margin-bottom:6px}
.trade-btns{display:flex;gap:4px;justify-content:center}
.trade-btns button{flex:1;padding:5px 0;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;transition:opacity .15s}
.buy-btn{background:#4a7a3a;color:#fff}
.sell-btn{background:#7a3a3a;color:#fff}
.buy-btn:disabled,.sell-btn:disabled{opacity:.3;cursor:default}

/* Travel button */
.travel-btn{width:100%;padding:12px;background:linear-gradient(135deg,#c4956a,#8a6040);border:none;color:#fff;
font-size:clamp(14px,3vw,16px);font-weight:700;border-radius:10px;cursor:pointer;margin-top:4px;transition:opacity .15s}
.travel-btn:disabled{opacity:.4;cursor:default}

/* Close panel */
.close-panel{position:absolute;top:8px;right:12px;background:none;border:none;color:#8a7a6a;font-size:24px;cursor:pointer;z-index:51}

/* Event overlay */
#eventOverlay{position:absolute;inset:0;background:rgba(10,5,2,.92);display:none;align-items:center;justify-content:center;z-index:80;padding:20px}
#eventOverlay.show{display:flex}
.event-card{background:#2a1a0a;border:2px solid #c4956a;border-radius:16px;padding:24px;max-width:400px;width:100%;text-align:center}
.event-card .ev-icon{font-size:48px;margin-bottom:12px}
.event-card .ev-title{font-size:clamp(16px,4vw,22px);font-weight:800;color:#c4956a;margin-bottom:8px}
.event-card .ev-desc{font-size:clamp(12px,2.5vw,14px);color:#a09080;line-height:1.6;margin-bottom:16px}
.event-card .ev-effect{font-size:clamp(12px,2.5vw,14px);font-weight:700;padding:8px;border-radius:8px;margin-bottom:16px}
.ev-good{background:#1a3a1a;color:#6aaa5a;border:1px solid #3a5a3a}
.ev-bad{background:#3a1a1a;color:#aa5a5a;border:1px solid #5a3a3a}
.ev-neutral{background:#2a2a1a;color:#aaaa5a;border:1px solid #4a4a3a}
.event-card .ev-btn{padding:10px 32px;background:linear-gradient(135deg,#c4956a,#8a6040);border:none;color:#fff;
font-size:15px;font-weight:700;border-radius:10px;cursor:pointer}
.ev-choices{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.ev-choice-btn{padding:10px 16px;background:#3a2a1a;border:1px solid #5a4a3a;color:#d4a574;font-size:clamp(12px,2.5vw,14px);
font-weight:600;border-radius:8px;cursor:pointer;text-align:left;transition:background .15s}
.ev-choice-btn:hover{background:#4a3a2a}

/* Victory / Game Over */
#endScreen{position:absolute;inset:0;background:rgba(10,5,2,.95);display:none;align-items:center;justify-content:center;z-index:90;padding:20px}
#endScreen.show{display:flex}
.end-card{background:linear-gradient(135deg,#2a1a0a,#1a0e05);border:2px solid #c4956a;border-radius:16px;padding:32px;
max-width:420px;width:100%;text-align:center}
.end-card h2{font-size:clamp(22px,5vw,32px);font-weight:900;color:#c4956a;margin-bottom:8px}
.end-card .end-icon{font-size:64px;margin-bottom:16px}
.end-card .end-stats{text-align:left;margin:16px 0;font-size:14px;color:#a09080;line-height:1.8}
.end-card .end-stats strong{color:#d4a574}
.end-card .retry-btn{padding:12px 40px;background:linear-gradient(135deg,#c4956a,#8a6040);border:none;color:#fff;
font-size:16px;font-weight:700;border-radius:10px;cursor:pointer;margin-top:8px}

/* Traveling animation overlay */
#travelOverlay{position:absolute;inset:0;background:rgba(10,5,2,.88);display:none;align-items:center;justify-content:center;
z-index:70;flex-direction:column;gap:16px}
#travelOverlay.show{display:flex}
.travel-text{font-size:clamp(14px,3vw,18px);color:#c4956a;font-weight:700}
.travel-progress{width:200px;height:6px;background:#2a1a0a;border-radius:3px;overflow:hidden}
.travel-progress-bar{height:100%;background:#c4956a;width:0%;transition:width 1.5s ease-in-out;border-radius:3px}
.travel-camel{font-size:48px;animation:camelWalk 1s infinite}
@keyframes camelWalk{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* Scrollbar */
.city-panel::-webkit-scrollbar{width:4px}
.city-panel::-webkit-scrollbar-track{background:#1a0e05}
.city-panel::-webkit-scrollbar-thumb{background:#3a2a1a;border-radius:2px}

/* Journey progress bar at top of map */
.journey-bar{position:absolute;top:0;left:0;right:0;height:3px;background:#1a0e05;z-index:10}
.journey-fill{height:100%;background:linear-gradient(90deg,#c4956a,#d4a574);transition:width .5s}
</style>
</head>

<div class="lang-sw">

</div>

<!-- TITLE SCREEN -->
<div id="titleScreen">
<div class="camel-art">🐪</div>
<h1 id="mainTitle">シルクロードの隊商</h1>
<div class="subtitle" id="mainSub">Silk Road Caravan</div>
<div class="year-label">紀元前130年 / 130 BC</div>
<div class="intro" id="mainIntro">
紀元前130年、漢の武帝の命を受けた<strong>張騫</strong>が西域への道を切り拓いた。
絹・翡翠・香辛料——東西の宝を積んだ隊商が砂漠と山脈を越え、
<strong>長安からローマ</strong>まで約7000kmの古代最大の交易路を旅する。
砂嵐、盗賊、オアシスでの出会い。交易で富を築き、無事にローマへ辿り着けるか？
</div>
<button class="start-btn" id="startBtn" onclick="startGame()">▶ 旅に出る</button>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
<div class="top-bar">
  <div class="res"><span class="icon">💰</span><span class="val" id="goldVal">500</span></div>

  <div class="res"><span class="icon">❤️</span><span class="val" id="healthVal">100</span></div>
  <div class="res"><span class="icon">🐪</span><span class="val" id="camelVal">5</span></div>
  <div class="res"><span class="icon">📍</span><span class="val" id="cityLabel">長安</span></div>
</div>

<div class="map-area">
  <canvas class="map-canvas" id="mapCanvas"></canvas>
  <div class="journey-bar"><div class="journey-fill" id="journeyFill"></div></div>
</div>

<div class="city-panel" id="cityPanel">
  <button class="close-panel" onclick="closePanel()">&times;</button>
  <div class="city-name" id="panelCityName"></div>
  <div class="city-desc" id="panelCityDesc"></div>
  <div class="history-box" id="panelHistory"></div>
  <div class="trade-grid" id="tradeGrid"></div>
  <div id="supplyShop"></div>
  <button class="travel-btn" id="travelBtn" onclick="travelToNext()">次の都市へ出発 →</button>
</div>

<div id="eventOverlay"><div class="event-card" id="eventCard"></div></div>
<div id="travelOverlay">
  <div class="travel-camel">🐪🐫🐪</div>
  <div class="travel-text" id="travelText">砂漠を進んでいます…</div>
  <div class="travel-progress"><div class="travel-progress-bar" id="travelBar"></div></div>
</div>
</div>

<div id="endScreen"><div class="end-card" id="endCard"></div></div>

let state = null;

function newState(){
  return {
    gold: 500, water: 100, health: 100, camels: 5,
    cityIdx: 0, days: 0, startGold: 500,
    inventory: Object.fromEntries(GOODS.map(g => [g.id, 0])),
    visitedCities: 1,
  };
}

function startGame(){
  state = newState();
  document.getElementById('titleScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'flex';
  document.getElementById('endScreen').classList.remove('show');
  renderMap();
  openCityPanel(0);
  updateTopBar();
}

function updateTopBar(){
  document.getElementById('goldVal').textContent = state.gold;
  document.getElementById('waterVal').textContent = state.water;
  document.getElementById('healthVal').textContent = state.health;
  document.getElementById('camelVal').textContent = state.camels;
  const c = CITIES[state.cityIdx];
  document.getElementById('cityLabel').textContent = lang==='ja' ? c.ja : c.en;
  document.getElementById('journeyFill').style.width = (state.cityIdx / (CITIES.length-1) * 100) + '%';
}

function renderMap(){
  const canvas = document.getElementById('mapCanvas');
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * 2;
  canvas.height = rect.height * 2;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.scale(2,2);
  const w = W/2, h = H/2;

  // Background gradient (desert tones)
  const bg = ctx.createLinearGradient(0,0,w,0);
  bg.addColorStop(0,'#2a1a08');
  bg.addColorStop(0.3,'#3a2510');
  bg.addColorStop(0.5,'#4a3018');
  bg.addColorStop(0.7,'#3a2510');
  bg.addColorStop(1,'#1a1408');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,w,h);

  // Subtle terrain texture
  ctx.globalAlpha = 0.15;
  for(let i=0;i<200;i++){
    ctx.fillStyle = ['#5a4020','#6a5030','#4a3010'][i%3];
    ctx.beginPath();
    ctx.arc(Math.random()*w, Math.random()*h, Math.random()*3+1, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Mountain ranges (decorative)
  ctx.fillStyle = '#2a1a0a';
  drawMountains(ctx, w*0.25, h*0.15, 8, w*0.15, h*0.18);
  drawMountains(ctx, w*0.55, h*0.12, 6, w*0.12, h*0.15);

  // Draw route
  ctx.strokeStyle = '#c4956a44';
  ctx.lineWidth = 3;
  ctx.setLineDash([8,6]);
  ctx.beginPath();
  for(let i=0;i<CITIES.length;i++){
    const cx = CITIES[i].x * w, cy = CITIES[i].y * h;
    if(i===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
  }
  ctx.stroke();
  ctx.setLineDash([]);

  // Traveled route
  if(state && state.cityIdx > 0){
    ctx.strokeStyle = '#c4956a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    for(let i=0;i<=state.cityIdx;i++){
      const cx = CITIES[i].x * w, cy = CITIES[i].y * h;
      if(i===0) ctx.moveTo(cx,cy); else ctx.lineTo(cx,cy);
    }
    ctx.stroke();
  }

  // Cities
  for(let i=0;i<CITIES.length;i++){
    const c = CITIES[i];
    const cx = c.x * w, cy = c.y * h;
    const visited = state && i <= state.cityIdx;
    const current = state && i === state.cityIdx;

    // City dot
    ctx.beginPath();
    ctx.arc(cx,cy,current?8:6,0,Math.PI*2);
    ctx.fillStyle = current ? '#c4956a' : visited ? '#8a6a4a' : '#4a3a2a';
    ctx.fill();
    if(current){
      ctx.strokeStyle = '#c4956a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx,cy,12,0,Math.PI*2);
      ctx.stroke();
    }

    // City name
    ctx.font = `${current?'bold ':''}${Math.max(10,Math.min(13,w/50))}px sans-serif`;
    ctx.fillStyle = visited ? '#d4a574' : '#6a5a4a';
    ctx.textAlign = 'center';
    const name = lang==='ja' ? c.ja : c.en;
    ctx.fillText(name, cx, cy - 14);
  }

  // Camel icon at current city
  if(state){
    const cur = CITIES[state.cityIdx];
    ctx.font = `${Math.max(16,Math.min(24,w/25))}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('🐪', cur.x*w, cur.y*h + 28);
  }

  // Click handler
  canvas.onclick = (e) => {
    const r = canvas.getBoundingClientRect();
    const mx = (e.clientX - r.left);
    const my = (e.clientY - r.top);
    for(let i=0;i<CITIES.length;i++){
      const cx = CITIES[i].x * w, cy = CITIES[i].y * h;
      if(Math.hypot(mx-cx, my-cy) < 24 && state && i <= state.cityIdx){
        openCityPanel(i);
        break;
      }
    }
  };
}

function drawMountains(ctx, x, y, count, spread, maxH){
  for(let i=0;i<count;i++){
    const mx = x + (i - count/2) * (spread/count) * 1.5;
    const mh = maxH * (0.5 + Math.random()*0.5);
    ctx.beginPath();
    ctx.moveTo(mx - spread/count, y + mh*0.3);
    ctx.lineTo(mx, y - mh*0.7);
    ctx.lineTo(mx + spread/count, y + mh*0.3);
    ctx.fill();
  }
}

function openCityPanel(idx){
  const c = CITIES[idx];
  const panel = document.getElementById('cityPanel');
  document.getElementById('panelCityName').textContent = (lang==='ja'?c.ja:c.en) + ' — ' + (lang==='ja'?c.en:c.ja);
  document.getElementById('panelCityDesc').textContent = lang==='ja' ? c.descJa : c.descEn;

  const hist = document.getElementById('panelHistory');
  hist.innerHTML = `<div class="hist-title">${t('histTitle')}</div>${lang==='ja'?c.histJa:c.histEn}`;

  renderTradeGrid(idx);
  renderSupplyShop(idx);

  const btn = document.getElementById('travelBtn');
  if(idx === state.cityIdx && idx < CITIES.length - 1){
    btn.style.display = 'block';
    btn.textContent = t('nextCity');
    btn.disabled = state.water <= 0 || state.health <= 0 || state.camels <= 0;
  } else if(idx === CITIES.length - 1 && idx === state.cityIdx){
    btn.style.display = 'none';
    setTimeout(() => showVictory(), 500);
  } else {
    btn.style.display = 'none';
  }

  panel.classList.add('show');
}

function closePanel(){ document.getElementById('cityPanel').classList.remove('show'); }

function renderTradeGrid(cityIdx){
  const grid = document.getElementById('tradeGrid');
  const c = CITIES[cityIdx];
  grid.innerHTML = '';
  GOODS.forEach(g => {
    const price = Math.round(g.base * (c.priceMod[g.id]||1));
    const own = state.inventory[g.id];
    const canBuy = state.gold >= price && state.camels * 10 > Object.values(state.inventory).reduce((a,b)=>a+b,0);
    const canSell = own > 0;
    const div = document.createElement('div');
    div.className = 'trade-item';
    div.innerHTML = `
      <div class="t-name">${g.emoji} ${lang==='ja'?g.ja:g.en}</div>
      <div class="t-price">${t('price')}💰${price}</div>
      <div class="t-own">${t('own')}${own}</div>
      <div class="trade-btns">
        <button class="buy-btn" ${canBuy?'':'disabled'} onclick="buyGood('${g.id}',${price},${cityIdx})">${t('buy')}</button>
        <button class="sell-btn" ${canSell?'':'disabled'} onclick="sellGood('${g.id}',${price},${cityIdx})">${t('sell')}</button>
      </div>`;
    grid.appendChild(div);
  });
}

function renderSupplyShop(cityIdx){
  const shop = document.getElementById('supplyShop');
  const c = CITIES[cityIdx];
  if(!c.supply || cityIdx !== state.cityIdx){
    shop.innerHTML = '';
    return;
  }
  shop.innerHTML = `
    <div style="font-weight:700;margin:8px 0 6px;color:#c4956a;font-size:14px">${t('supplyTitle')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="trade-btns" style="flex:1;padding:8px 12px;background:#2a3a2a;border:1px solid #3a5a3a;color:#8aba7a;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;min-width:120px"
        onclick="buySupply('water')" ${state.gold>=30?'':'disabled'}>${t('waterCost')}</button>
      <button class="trade-btns" style="flex:1;padding:8px 12px;background:#2a2a3a;border:1px solid #3a3a5a;color:#7a8aba;border-radius:8px;cursor:pointer;font-size:13px;font-weight:600;min-width:120px"
        onclick="buySupply('camel')" ${state.gold>=80?'':'disabled'}>${t('camelCost')}</button>
    </div>`;
}

function buyGood(id, price, cityIdx){
  if(state.gold < price) return;
  const totalItems = Object.values(state.inventory).reduce((a,b)=>a+b,0);
  if(totalItems >= state.camels * 10) return;
  state.gold -= price;
  state.inventory[id]++;
  updateTopBar();
  renderTradeGrid(cityIdx);
  renderSupplyShop(cityIdx);
}

function sellGood(id, price, cityIdx){
  if(state.inventory[id] <= 0) return;
  state.gold += price;
  state.inventory[id]--;
  updateTopBar();
  renderTradeGrid(cityIdx);
  renderSupplyShop(cityIdx);
}

function buySupply(type){
  if(type === 'water' && state.gold >= 30){
    state.gold -= 30;
    state.water = Math.min(150, state.water + 50);
  } else if(type === 'camel' && state.gold >= 80){
    state.gold -= 80;
    state.camels++;
  }
  updateTopBar();
  renderSupplyShop(state.cityIdx);
}

function travelToNext(){
  if(state.cityIdx >= CITIES.length - 1) return;
  closePanel();

  // Show travel overlay
  const overlay = document.getElementById('travelOverlay');
  const bar = document.getElementById('travelBar');
  const text = document.getElementById('travelText');
  overlay.classList.add('show');
  text.textContent = t('traveling');
  bar.style.width = '0%';

  setTimeout(() => { bar.style.width = '100%'; }, 100);

  // Travel costs
  state.water -= 15 + Math.floor(Math.random()*10);
  state.days += 8 + Math.floor(Math.random()*7);

  setTimeout(() => {
    overlay.classList.remove('show');
    bar.style.width = '0%';

    // Random event (80% chance)
    if(Math.random() < 0.8){
      triggerEvent();
    } else {
      arriveAtCity();
    }
  }, 2200);
}

function triggerEvent(){
  const events = lang==='ja' ? EVENTS_JA : EVENTS_EN;
  const ev = events[Math.floor(Math.random()*events.length)];

  const overlay = document.getElementById('eventOverlay');
  const card = document.getElementById('eventCard');

  let choicesHtml = '<div class="ev-choices">';
  ev.choices.forEach((ch, i) => {
    choicesHtml += `<button class="ev-choice-btn" onclick="resolveEvent(${i})">${ch.text}</button>`;
  });
  choicesHtml += '</div>';

  card.innerHTML = `
    <div class="ev-icon">${ev.icon}</div>
    <div class="ev-title">${ev.title}</div>
    <div class="ev-desc">${ev.desc}</div>
    ${choicesHtml}`;

  overlay.classList.add('show');
  card._event = ev;
}

function resolveEvent(choiceIdx){
  const card = document.getElementById('eventCard');
  const ev = card._event;
  const choice = ev.choices[choiceIdx];
  const eff = choice.effect;

  if(eff.gold) state.gold += eff.gold;
  if(eff.water) state.water += eff.water;
  if(eff.health) state.health += eff.health;
  if(eff.camels) state.camels += eff.camels;
  if(eff.days) state.days += eff.days;

  if(eff.randomLoss){
    const owned = GOODS.filter(g => state.inventory[g.id] > 0);
    if(owned.length > 0){
      const g = owned[Math.floor(Math.random()*owned.length)];
      const loss = Math.min(state.inventory[g.id], Math.ceil(Math.random()*3));
      state.inventory[g.id] -= loss;
    }
  }
  if(eff.randomGain){
    const g = GOODS[Math.floor(Math.random()*GOODS.length)];
    state.inventory[g.id] += Math.ceil(Math.random()*3);
  }

  state.water = Math.max(0, Math.min(150, state.water));
  state.health = Math.max(0, Math.min(100, state.health));
  state.camels = Math.max(0, state.camels);
  state.gold = Math.max(0, state.gold);

  // Determine effect class
  let effClass = 'ev-neutral';
  const net = (eff.gold||0) + (eff.health||0) + (eff.water||0) + (eff.camels||0)*20;
  if(net > 0) effClass = 'ev-good';
  else if(net < 0) effClass = 'ev-bad';

  card.innerHTML = `
    <div class="ev-icon">${ev.icon}</div>
    <div class="ev-title">${ev.title}</div>
    <div class="ev-effect ${effClass}">${choice.result}</div>
    <button class="ev-btn" onclick="closeEventAndArrive()">${t('ok')}</button>`;

  updateTopBar();
}

function closeEventAndArrive(){
  document.getElementById('eventOverlay').classList.remove('show');
  if(state.health <= 0 || state.camels <= 0){
    showGameOver(state.health <= 0 ?
      (lang==='ja'?'体力が尽きた':'Health depleted') :
      (lang==='ja'?'ラクダを全て失った':'All camels lost'));
    return;
  }
  if(state.water <= 0){
    state.health -= 30;
    if(state.health <= 0){
      showGameOver(lang==='ja'?'水が尽き、砂漠で倒れた':'Ran out of water in the desert');
      return;
    }
  }
  arriveAtCity();
}

function arriveAtCity(){
  state.cityIdx++;
  state.visitedCities++;
  updateTopBar();
  renderMap();

  if(state.cityIdx >= CITIES.length - 1){
    openCityPanel(state.cityIdx);
  } else {
    openCityPanel(state.cityIdx);
  }
}

function showVictory(){
  closePanel();
  const profit = state.gold - state.startGold;
  const totalGoods = Object.values(state.inventory).reduce((a,b)=>a+b,0);
  const goodsValue = GOODS.reduce((sum,g) => {
    const romePrice = Math.round(g.base * (CITIES[CITIES.length-1].priceMod[g.id]||1));
    return sum + state.inventory[g.id] * romePrice;
  }, 0);
  const totalWealth = state.gold + goodsValue;
  let rankIdx = 0;
  if(totalWealth >= 2000) rankIdx = 4;
  else if(totalWealth >= 1200) rankIdx = 3;
  else if(totalWealth >= 800) rankIdx = 2;
  else if(totalWealth >= 500) rankIdx = 1;

  const screen = document.getElementById('endScreen');
  const card = document.getElementById('endCard');
  card.innerHTML = `
    <div class="end-icon">🏛️🐪🎉</div>
    <h2>${t('victory')}</h2>
    <p style="color:#a09080;margin-bottom:12px">${t('victoryDesc')}</p>
    <div class="end-stats">
      <strong>${t('daysLabel')}</strong>${state.days}${lang==='ja'?'日':' days'}<br>
      <strong>${t('citiesLabel')}</strong>${state.visitedCities}<br>
      <strong>${t('finalGold')}</strong>💰${state.gold}<br>
      <strong>${lang==='ja'?'残り交易品価値: ':'Remaining goods value: '}</strong>💰${goodsValue}<br>
      <strong>${t('profitLabel')}</strong>💰${totalWealth - state.startGold}<br>
      <strong>${t('rank')}</strong>${t('ranks')[rankIdx]}
    </div>
    <button class="retry-btn" onclick="restartGame()">${t('retry')}</button>`;
  screen.classList.add('show');
  screen.style.display = 'flex';
}

function showGameOver(reason){
  closePanel();
  const screen = document.getElementById('endScreen');
  const card = document.getElementById('endCard');
  card.innerHTML = `
    <div class="end-icon">💀🏜️</div>
    <h2>${t('gameover')}</h2>
    <div class="end-stats">
      <strong>${t('goReason')}</strong>${reason}<br>
      <strong>${t('goGold')}</strong>💰${state.gold}<br>
      <strong>${t('goWater')}</strong>💧${state.water}<br>
      <strong>${t('goHealth')}</strong>❤️${state.health}<br>
      <strong>${t('goCamels')}</strong>🐪${state.camels}<br>
      <strong>${t('daysLabel')}</strong>${state.days}${lang==='ja'?'日':' days'}<br>
      <strong>${lang==='ja'?'到達地: ':'Reached: '}</strong>${lang==='ja'?CITIES[state.cityIdx].ja:CITIES[state.cityIdx].en}
    </div>
    <button class="retry-btn" onclick="restartGame()">${t('retry')}</button>`;
  screen.classList.add('show');
  screen.style.display = 'flex';
}

function restartGame(){
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('endScreen').style.display = 'none';
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('titleScreen').style.display = 'flex';
}

function updateUI(){
  document.getElementById('mainTitle').textContent = t('title');
  document.getElementById('mainSub').textContent = t('sub');
  document.getElementById('mainIntro').innerHTML = t('intro');
  document.getElementById('startBtn').textContent = t('start');
  if(state){
    updateTopBar();
    renderMap();
    if(document.getElementById('cityPanel').classList.contains('show')){
      openCityPanel(state.cityIdx);
    }
  }
}

window.addEventListener('resize', () => { if(state) renderMap(); });
</script>
</body>
</html>
